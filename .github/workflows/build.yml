name: build

# Testes em Windows, Linux e macOS a cada push/PR; em tags v*, gera os pacotes das três plataformas
# e anexa ao release do GitHub (sem sobrescrever arquivos que já estejam lá).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de um release existente para gerar e anexar os pacotes (ex.: v2.2.0)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8
  QT_QPA_PLATFORM: offscreen
  RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
          - name: Linux x64
            os: ubuntu-22.04
          - name: macOS arm64
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Bibliotecas do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libdbus-1-3 libfontconfig1 libpulse0 libasound2 fonts-dejavu-core

      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Testes
        run: python -m pytest -q tests

      - name: Selftest (código-fonte)
        run: python main.py --selftest

      - name: Build (Windows)
        if: runner.os == 'Windows' && env.RELEASE_TAG != ''
        shell: cmd
        run: |
          choco install innosetup -y --no-progress
          python -m venv .venv
          .venv\Scripts\python -m pip install -r requirements-dev.txt
          build.bat --skip-tests

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows' && env.RELEASE_TAG != ''
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
          chmod +x build.sh
          ./build.sh --skip-tests

      - name: Coletar pacotes
        if: env.RELEASE_TAG != ''
        shell: bash
        run: |
          mkdir -p out
          cp dist/installer/*.exe out/ 2>/dev/null || true
          cp dist/*.tar.gz dist/*.dmg out/ 2>/dev/null || true
          cd out
          if command -v sha256sum >/dev/null; then sha256sum * > "SHA256SUMS-${{ runner.os }}.txt"; else shasum -a 256 * > "SHA256SUMS-${{ runner.os }}.txt"; fi
          cat SHA256SUMS-*.txt

      - uses: actions/upload-artifact@v4
        if: env.RELEASE_TAG != ''
        with:
          name: WhisperDesk-${{ runner.os }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Anexar ao release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "WhisperDesk ${TAG#v}" --notes "Pacotes gerados pelo CI."
          existing="$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')"
          cat out/SHA256SUMS-*.txt > all-sums.txt
          : > SHA256SUMS-ci.txt
          for f in out/*; do
            name="$(basename "$f")"
            case "$name" in SHA256SUMS-*) continue ;; esac
            if echo "$existing" | grep -qxF "$name"; then
              echo "já existe, mantido: $name"   # ex.: instalador publicado e testado manualmente
            else
              gh release upload "$TAG" "$f" -R "$GITHUB_REPOSITORY"
              grep -F "$name" all-sums.txt >> SHA256SUMS-ci.txt
            fi
          done
          if [ -s SHA256SUMS-ci.txt ]; then
            cat SHA256SUMS-ci.txt
            gh release upload "$TAG" SHA256SUMS-ci.txt -R "$GITHUB_REPOSITORY" --clobber
          fi
